name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generated data is up to date
        run: npm run build:data && git diff --exit-code data/
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Worker bundle builds (wrangler needs Node 22)
        if: matrix.node == 22
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

name: Release
# Publishes to npm when a v* tag is pushed, using npm trusted publishing (OIDC):
# npm exchanges the GitHub OIDC token for a short-lived publish credential and attaches
# provenance on its own. The trusted publisher is configured on npmjs.com (package
# Settings -> Trusted Publisher: ianhudsonai/taco-br-mcp, workflow release.yml).
#
# TRANSITION: NPM_TOKEN is still wired below as a fallback. npm tries OIDC first and only
# uses the token if OIDC is unavailable. Once a release has gone through with the trusted
# publisher configured, delete the NODE_AUTH_TOKEN env and the NPM_TOKEN secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm request the OIDC token (trusted publishing and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          # Fallback only; remove after the first successful trusted-publishing release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
